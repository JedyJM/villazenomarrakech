name: Sync availability calendar

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and merge iCal
        env:
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        run: |
          python3 scripts/sync-availability.py --out data/availability.json | tee /tmp/sync-out.txt

      - name: Commit if changed
        run: |
          if grep -q '^UNCHANGED$' /tmp/sync-out.txt; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "chore: sync availability calendar"
          git push
