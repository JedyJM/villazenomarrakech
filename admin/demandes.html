<button type="button" data-filter="aujourd" aria-pressed="false">Aujourd’hui</button>

</div>

<div data-list></div>
<p class="foot-note">Relancer ouvre votre WhatsApp. Rien n’est envoyé tout seul.</p>

<section class="statut-sheet" data-sheet hidden aria-label="Changer le statut">
<p class="kicker">Changer le statut</p>
<div data-statut-list></div>
<button type="button" class="ghost" data-sheet-close>Fermer</button>
</section>
</main>
