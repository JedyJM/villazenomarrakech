<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande confirmée | Villa Zen’O</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1ea">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body class="page-staff">
<main>
<p class="staff-ok">✅ Demande confirmée. Merci !</p>
<p class="staff-summary" data-summary></p>
</main>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var summary = document.querySelector("[data-summary]");
  summary.textContent = params.get("r") || "";
  var id = params.get("id");
  if (!id) return;
  try {
    var key = "villazeno.demandes";
    var list = JSON.parse(localStorage.getItem(key) || "[]");
    if (!Array.isArray(list)) return;
    var changed = false;
    list.forEach(function (item) {
      if (!item || item.id !== id) return;
      item.status = "confirmee";
      item.confirmed_at = new Date().toISOString();
      changed = true;
    });
    if (changed) localStorage.setItem(key, JSON.stringify(list));
  } catch (e) {}
})();
</script>
</body>
</html>
